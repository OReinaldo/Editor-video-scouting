<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editor y Analizador de Cortes de Vídeo</title>
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-card: #334155;
            --accent-green: #10b981;
            --accent-green-hover: #059669;
            --accent-blue: #3b82f6;
            --accent-blue-hover: #2563eb;
            --accent-amber: #f59e0b;
            --accent-red: #ef4444;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #475569;
            --font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            font-family: var(--font-family);
            line-height: 1.5;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
        }

        header h1 {
            font-size: 1.5rem;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .file-selector {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .file-btn-label {
            background-color: var(--accent-blue);
            color: white;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            font-size: 0.9rem;
            transition: background 0.2s;
        }

        .file-btn-label:hover {
            background-color: var(--accent-blue-hover);
        }

        input[type="file"] {
            display: none;
        }

        /* Layout Principal */
        .main-layout {
            display: grid;
            grid-template-columns: 1fr 380px;
            gap: 20px;
        }

        @media (max-width: 992px) {
            .main-layout {
                grid-template-columns: 1fr;
            }
        }

        /* Sección Vídeo */
        .video-section {
            background-color: var(--bg-secondary);
            border-radius: 10px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            border: 1px solid var(--border-color);
        }

        .video-wrapper {
            position: relative;
            width: 100%;
            background-color: #000;
            border-radius: 8px;
            overflow: hidden;
            aspect-ratio: 16 / 9;
        }

        video {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: contain;
        }

        /* Barra de Progreso Personalizada con Rango de Corte */
        .timeline-container {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .timeline-bar {
            position: relative;
            height: 14px;
            background-color: #475569;
            border-radius: 7px;
            cursor: pointer;
            overflow: hidden;
        }

        .timeline-cut-region {
            position: absolute;
            top: 0;
            height: 100%;
            background-color: rgba(16, 185, 129, 0.4);
            border-left: 2px solid var(--accent-green);
            border-right: 2px solid var(--accent-green);
        }

        .timeline-progress {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 0%;
            background-color: rgba(255, 255, 255, 0.3);
            pointer-events: none;
        }

        .timeline-head {
            position: absolute;
            top: 0;
            width: 4px;
            height: 100%;
            background-color: #ffffff;
            box-shadow: 0 0 6px rgba(0,0,0,0.8);
            transform: translateX(-50%);
            pointer-events: none;
        }

        .time-display-bar {
            display: flex;
            justify-content: space-between;
            font-family: monospace;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        /* Controles de Corte */
        .controls-panel {
            background-color: var(--bg-secondary);
            border-radius: 10px;
            padding: 16px;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .control-block {
            background-color: var(--bg-card);
            padding: 12px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .control-block-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .control-block-header label {
            font-weight: 600;
            font-size: 0.95rem;
            color: #e2e8f0;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .time-input-row {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .time-input {
            background-color: #0f172a;
            border: 1px solid var(--border-color);
            color: #38bdf8;
            font-family: monospace;
            font-size: 1.1rem;
            font-weight: bold;
            padding: 6px 10px;
            border-radius: 6px;
            width: 120px;
            text-align: center;
        }

        .time-input:focus {
            outline: 2px solid var(--accent-blue);
            border-color: transparent;
        }

        /* Botones generales */
        button {
            cursor: pointer;
            border: none;
            border-radius: 6px;
            font-weight: 500;
            transition: all 0.15s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        .btn-set {
            background-color: var(--accent-blue);
            color: white;
            padding: 6px 12px;
            font-size: 0.85rem;
        }

        .btn-set:hover {
            background-color: var(--accent-blue-hover);
        }

        .btn-step {
            background-color: #475569;
            color: #f1f5f9;
            padding: 6px 8px;
            font-size: 0.8rem;
            font-family: monospace;
            min-width: 42px;
        }

        .btn-step:hover {
            background-color: #64748b;
        }

        .btn-play-clip {
            background-color: var(--accent-green);
            color: white;
            padding: 12px;
            font-size: 1rem;
            font-weight: bold;
            width: 100%;
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
        }

        .btn-play-clip:hover {
            background-color: var(--accent-green-hover);
        }

        .btn-play-clip.is-playing {
            background-color: var(--accent-amber);
            color: #000;
        }

        .btn-save-clip {
            background-color: transparent;
            border: 1px solid var(--accent-blue);
            color: var(--accent-blue);
            padding: 10px;
            font-size: 0.9rem;
            width: 100%;
            border-radius: 8px;
        }

        .btn-save-clip:hover {
            background-color: rgba(59, 130, 246, 0.1);
        }

        /* Status & Feedback */
        .status-badge {
            font-size: 0.75rem;
            padding: 3px 8px;
            border-radius: 12px;
            text-transform: uppercase;
            font-weight: bold;
        }

        .status-badge.stopped {
            background-color: #475569;
            color: #cbd5e1;
        }

        .status-badge.playing-clip {
            background-color: var(--accent-green);
            color: #022c22;
        }

        /* Lista de Cortes Guardados */
        .clips-library {
            background-color: var(--bg-secondary);
            border-radius: 10px;
            padding: 16px;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .clips-library h2 {
            font-size: 1.1rem;
            color: #e2e8f0;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .clip-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 400px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .clip-card {
            background-color: var(--bg-card);
            border-radius: 8px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            border-left: 4px solid var(--accent-green);
        }

        .clip-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .clip-title {
            font-weight: 600;
            font-size: 0.9rem;
            color: #f1f5f9;
        }

        .clip-duration {
            font-size: 0.75rem;
            background-color: #0f172a;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: monospace;
            color: #38bdf8;
        }

        .clip-times {
            font-family: monospace;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .clip-actions {
            display: flex;
            gap: 6px;
            margin-top: 4px;
        }

        .btn-clip-action {
            padding: 4px 8px;
            font-size: 0.75rem;
            background-color: #0f172a;
            color: #cbd5e1;
            border: 1px solid var(--border-color);
        }

        .btn-clip-action:hover {
            background-color: #1e293b;
            color: #ffffff;
        }

        .btn-clip-delete {
            color: var(--accent-red);
            border-color: rgba(239, 68, 68, 0.3);
            margin-left: auto;
        }

        .btn-clip-delete:hover {
            background-color: rgba(239, 68, 68, 0.2);
            color: #fca5a5;
        }

        .empty-state {
            color: var(--text-muted);
            font-size: 0.85rem;
            text-align: center;
            padding: 20px 0;
            font-style: italic;
        }

        .tag-input {
            background-color: #0f172a;
            border: 1px solid var(--border-color);
            color: white;
            padding: 8px 10px;
            border-radius: 6px;
            width: 100%;
            font-size: 0.85rem;
        }

        .shortcuts-info {
            background-color: rgba(15, 23, 42, 0.6);
            border-radius: 6px;
            padding: 10px;
            font-size: 0.75rem;
            color: var(--text-muted);
            line-height: 1.4;
        }

        .shortcuts-info strong {
            color: #cbd5e1;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>✂️ Editor y Analizador de Cortes de Vídeo</h1>
        <div class="file-selector">
            <label for="videoFileInput" class="file-btn-label">📁 Cargar vídeo local</label>
            <input type="file" id="videoFileInput" accept="video/*">
        </div>
    </header>

    <div class="main-layout">
        <!-- Columna Izquierda: Reproductor -->
        <div class="video-section">
            <div class="video-wrapper">
                <video id="videoPlayer" crossorigin="anonymous">
                    <!-- Vídeo de muestra por defecto -->
                    <source src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4" type="video/mp4">
                    Tu navegador no soporta la etiqueta de vídeo.
                </video>
            </div>

            <!-- Timeline Interactiva -->
            <div class="timeline-container">
                <div class="timeline-bar" id="timelineBar">
                    <div class="timeline-cut-region" id="timelineCutRegion"></div>
                    <div class="timeline-progress" id="timelineProgress"></div>
                    <div class="timeline-head" id="timelineHead"></div>
                </div>
                <div class="time-display-bar">
                    <span id="lblCurrentTime">00:00.000</span>
                    <span id="lblStatus" class="status-badge stopped">Modo Estándar</span>
                    <span id="lblTotalDuration">00:00.000</span>
                </div>
            </div>

            <!-- Teclas rápidas -->
            <div class="shortcuts-info">
                <strong>Atajos de teclado:</strong> <code>Espacio</code> Rep/Pausa | <code>I</code> Fijar Inicio | <code>O</code> Fijar Fin | <code>P</code> Reproducir Corte | <code>← / →</code> Mover 0.1s
            </div>
        </div>

        <!-- Columna Derecha: Controles de Edición y Biblioteca -->
        <div class="controls-panel">
            
            <!-- Control Punto de Inicio -->
            <div class="control-block">
                <div class="control-block-header">
                    <label>🟢 Punto de Inicio (T_inicio)</label>
                    <button class="btn-set" onclick="setStartTimeFromVideo()">📍 Fijar Actual</button>
                </div>
                <div class="time-input-row">
                    <button class="btn-step" onclick="adjustStart(-1.0)">-1s</button>
                    <button class="btn-step" onclick="adjustStart(-0.1)">-0.1s</button>
                    <input type="text" id="inputStartTime" class="time-input" value="00:05.000" onchange="onManualStartChange(this.value)">
                    <button class="btn-step" onclick="adjustStart(+0.1)">+0.1s</button>
                    <button class="btn-step" onclick="adjustStart(+1.0)">+1s</button>
                </div>
            </div>

            <!-- Control Punto Final -->
            <div class="control-block">
                <div class="control-block-header">
                    <label>🔴 Punto Final (T_final)</label>
                    <button class="btn-set" onclick="setEndTimeFromVideo()">📍 Fijar Actual</button>
                </div>
                <div class="time-input-row">
                    <button class="btn-step" onclick="adjustEnd(-1.0)">-1s</button>
                    <button class="btn-step" onclick="adjustEnd(-0.1)">-0.1s</button>
                    <input type="text" id="inputEndTime" class="time-input" value="00:15.000" onchange="onManualEndChange(this.value)">
                    <button class="btn-step" onclick="adjustEnd(+0.1)">+0.1s</button>
                    <button class="btn-step" onclick="adjustEnd(+1.0)">+1s</button>
                </div>
            </div>

            <!-- Reproductor de Corte -->
            <button id="btnPlayClip" class="btn-play-clip" onclick="togglePlayClip()">
                ▶ Ver corte de vídeo
            </button>

            <!-- Guardar Corte -->
            <div style="display: flex; flex-direction: column; gap: 8px; margin-top: 5px;">
                <input type="text" id="inputClipTitle" class="tag-input" placeholder="Etiqueta / Descripción del corte (ej: Presión tras pérdida)">
                <button class="btn-save-clip" onclick="saveCurrentClip()">➕ Guardar corte en lista</button>
            </div>

            <!-- Lista de Cortes -->
            <div class="clips-library">
                <h2>Cortes Guardados <span id="clipCount" style="font-size:0.8rem; color:var(--text-muted);">(0)</span></h2>
                <div class="clip-list" id="clipListContainer">
                    <div class="empty-state">No hay cortes guardados en esta sesión.</div>
                </div>
            </div>

        </div>
    </div>
</div>

<script>
    // --- ESTADO DE LA APLICACIÓN ---
    const video = document.getElementById('videoPlayer');
    const inputStartTime = document.getElementById('inputStartTime');
    const inputEndTime = document.getElementById('inputEndTime');
    const btnPlayClip = document.getElementById('btnPlayClip');
    const lblCurrentTime = document.getElementById('lblCurrentTime');
    const lblTotalDuration = document.getElementById('lblTotalDuration');
    const lblStatus = document.getElementById('lblStatus');
    const timelineBar = document.getElementById('timelineBar');
    const timelineCutRegion = document.getElementById('timelineCutRegion');
    const timelineProgress = document.getElementById('timelineProgress');
    const timelineHead = document.getElementById('timelineHead');
    const clipListContainer = document.getElementById('clipListContainer');
    const clipCount = document.getElementById('clipCount');
    const inputClipTitle = document.getElementById('inputClipTitle');

    let startTime = 5.0; // segundos
    let endTime = 15.0;  // segundos
    let isPlayingClip = false;
    let animFrameId = null;
    let savedClips = [];

    // --- FORMATEO Y PARSEO DE TIEMPO ---
    
    // Convierte segundos (float) a "MM:SS.ms" o "HH:MM:SS.ms"
    function formatTime(seconds) {
        if (isNaN(seconds) || seconds < 0) return "00:00.000";
        const hrs = Math.floor(seconds / 3600);
        const mins = Math.floor((seconds % 3600) / 60);
        const secs = Math.floor(seconds % 60);
        const ms = Math.floor((seconds % 1) * 1000);

        const pad = (n, width = 2) => String(n).padStart(width, '0');

        if (hrs > 0) {
            return `${pad(hrs)}:${pad(mins)}:${pad(secs)}.${pad(ms, 3)}`;
        }
        return `${pad(mins)}:${pad(secs)}.${pad(ms, 3)}`;
    }

    // Parsea string tipo "01:23.500", "01:02:03.100" o "83.5" a segundos float
    function parseTimeToSeconds(timeStr) {
        if (!timeStr) return 0;
        const cleanStr = timeStr.trim().replace(',', '.');
        const parts = cleanStr.split(':');
        let totalSecs = 0;

        if (parts.length === 3) { // HH:MM:SS.ms
            totalSecs = parseFloat(parts[0]) * 3600 + parseFloat(parts[1]) * 60 + parseFloat(parts[2]);
        } else if (parts.length === 2) { // MM:SS.ms
            totalSecs = parseFloat(parts[0]) * 60 + parseFloat(parts[1]);
        } else { // Formato directo en segundos
            totalSecs = parseFloat(cleanStr);
        }

        return isNaN(totalSecs) || totalSecs < 0 ? 0 : totalSecs;
    }

    // --- INICIALIZACIÓN Y EVENTOS DE VÍDEO ---

    video.addEventListener('loadedmetadata', () => {
        lblTotalDuration.textContent = formatTime(video.duration);
        if (endTime > video.duration) endTime = Math.min(10, video.duration);
        updateUI();
    });

    video.addEventListener('timeupdate', () => {
        lblCurrentTime.textContent = formatTime(video.currentTime);
        updateTimelineProgress();
    });

    video.addEventListener('pause', () => {
        if (!isPlayingClip) {
            updateStatusBadge(false);
        }
    });

    // Carga de archivo de vídeo local
    document.getElementById('videoFileInput').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (file) {
            const fileURL = URL.createObjectURL(file);
            video.src = fileURL;
            video.load();
            stopClipPlayback();
            startTime = 0;
            endTime = 10;
            updateInputs();
        }
    });

    // --- LÓGICA DE CONTROL DE CORTES ---

    function setStartTimeFromVideo() {
        startTime = video.currentTime;
        if (startTime >= endTime) {
            endTime = Math.min(startTime + 5, video.duration || startTime + 5);
        }
        updateInputs();
        updateTimelineCutRegion();
    }

    function setEndTimeFromVideo() {
        endTime = video.currentTime;
        if (endTime <= startTime) {
            startTime = Math.max(0, endTime - 5);
        }
        updateInputs();
        updateTimelineCutRegion();
    }

    function adjustStart(delta) {
        let newTime = startTime + delta;
        newTime = Math.max(0, Math.min(newTime, video.duration || newTime));
        if (newTime >= endTime) {
            endTime = newTime + 0.5;
        }
        startTime = newTime;
        video.currentTime = startTime; // Saltar al frame para previsualizar
        updateInputs();
        updateTimelineCutRegion();
    }

    function adjustEnd(delta) {
        let newTime = endTime + delta;
        newTime = Math.max(0, Math.min(newTime, video.duration || newTime));
        if (newTime <= startTime) {
            startTime = Math.max(0, newTime - 0.5);
        }
        endTime = newTime;
        video.currentTime = endTime; // Saltar al frame final
        updateInputs();
        updateTimelineCutRegion();
    }

    function onManualStartChange(value) {
        const parsed = parseTimeToSeconds(value);
        startTime = Math.max(0, Math.min(parsed, video.duration || parsed));
        if (startTime >= endTime) {
            endTime = startTime + 1.0;
        }
        video.currentTime = startTime;
        updateInputs();
        updateTimelineCutRegion();
    }

    function onManualEndChange(value) {
        const parsed = parseTimeToSeconds(value);
        endTime = Math.max(0, Math.min(parsed, video.duration || parsed));
        if (endTime <= startTime) {
            startTime = Math.max(0, endTime - 1.0);
        }
        video.currentTime = endTime;
        updateInputs();
        updateTimelineCutRegion();
    }

    // --- REPRODUCCIÓN PRECISA DEL CORTE (START & STOP) ---

    function togglePlayClip() {
        if (isPlayingClip) {
            stopClipPlayback();
            video.pause();
        } else {
            playCurrentClip();
        }
    }

    function playCurrentClip() {
        if (endTime <= startTime) return;

        isPlayingClip = true;
        btnPlayClip.textContent = "⏸ Detener Previsualización de Corte";
        btnPlayClip.classList.add('is-playing');
        updateStatusBadge(true);

        // 1. Saltar al punto de inicio exacto
        video.currentTime = startTime;

        // 2. Iniciar reproducción
        video.play().then(() => {
            // Monitorizar el frame exacto con requestAnimationFrame
            checkClipBoundaryLoop();
        }).catch(err => {
            console.error("Error reproduciendo vídeo:", err);
            stopClipPlayback();
        });
    }

    function checkClipBoundaryLoop() {
        if (!isPlayingClip) return;

        // Si sobrepasa el punto final exacto
        if (video.currentTime >= endTime) {
            video.pause();
            video.currentTime = endTime; // Pausar y congelar en el fotograma final del corte
            stopClipPlayback();
            return;
        }

        // Seguir comprobando en cada cuadro de renderizado
        animFrameId = requestAnimationFrame(checkClipBoundaryLoop);
    }

    function stopClipPlayback() {
        isPlayingClip = false;
        if (animFrameId) cancelAnimationFrame(animFrameId);
        btnPlayClip.textContent = "▶ Ver corte de vídeo";
        btnPlayClip.classList.remove('is-playing');
        updateStatusBadge(false);
    }

    function updateStatusBadge(active) {
        if (active) {
            lblStatus.textContent = "Reproduciendo Corte";
            lblStatus.className = "status-badge playing-clip";
        } else {
            lblStatus.textContent = "Modo Estándar";
            lblStatus.className = "status-badge stopped";
        }
    }

    // --- RECIPIENTE Y ACTUALIZACIÓN DE UI ---

    function updateInputs() {
        inputStartTime.value = formatTime(startTime);
        inputEndTime.value = formatTime(endTime);
    }

    function updateTimelineCutRegion() {
        if (!video.duration) return;
        const startPercent = (startTime / video.duration) * 100;
        const endPercent = (endTime / video.duration) * 100;
        const widthPercent = endPercent - startPercent;

        timelineCutRegion.style.left = `${startPercent}%`;
        timelineCutRegion.style.width = `${widthPercent}%`;
    }

    function updateTimelineProgress() {
        if (!video.duration) return;
        const currentPercent = (video.currentTime / video.duration) * 100;
        timelineProgress.style.width = `${currentPercent}%`;
        timelineHead.style.left = `${currentPercent}%`;
    }

    // Clic en la barra de progreso para saltar posición
    timelineBar.addEventListener('click', (e) => {
        const rect = timelineBar.getBoundingClientRect();
        const clickPos = (e.clientX - rect.left) / rect.width;
        if (video.duration) {
            video.currentTime = clickPos * video.duration;
        }
    });

    function updateUI() {
        updateInputs();
        updateTimelineCutRegion();
        updateTimelineProgress();
    }

    // --- GESTIÓN DE BIBLIOTECA DE CORTES ---

    function saveCurrentClip() {
        const duration = endTime - startTime;
        if (duration <= 0) return;

        const title = inputClipTitle.value.trim() || `Corte #${savedClips.length + 1}`;
        const clip = {
            id: Date.now(),
            title: title,
            start: startTime,
            end: endTime,
            duration: duration
        };

        savedClips.push(clip);
        inputClipTitle.value = "";
        renderClipList();
    }

    function deleteClip(id) {
        savedClips = savedClips.filter(c => c.id !== id);
        renderClipList();
    }

    function loadClip(start, end) {
        startTime = start;
        endTime = end;
        video.currentTime = startTime;
        updateInputs();
        updateTimelineCutRegion();
    }

    function playSavedClip(start, end) {
        loadClip(start, end);
        playCurrentClip();
    }

    function renderClipList() {
        clipCount.textContent = `(${savedClips.length})`;

        if (savedClips.length === 0) {
            clipListContainer.innerHTML = '<div class="empty-state">No hay cortes guardados en esta sesión.</div>';
            return;
        }

        clipListContainer.innerHTML = savedClips.map(clip => `
            <div class="clip-card">
                <div class="clip-card-header">
                    <span class="clip-title">${escapeHtml(clip.title)}</span>
                    <span class="clip-duration">${clip.duration.toFixed(2)}s</span>
                </div>
                <div class="clip-times">
                    ⏱ ${formatTime(clip.start)} ➔ ${formatTime(clip.end)}
                </div>
                <div class="clip-actions">
                    <button class="btn-clip-action" onclick="playSavedClip(${clip.start}, ${clip.end})">▶ Ver corte</button>
                    <button class="btn-clip-action" onclick="loadClip(${clip.start}, ${clip.end})">✏️ Cargar</button>
                    <button class="btn-clip-action btn-clip-delete" onclick="deleteClip(${clip.id})">🗑️ Eliminar</button>
                </div>
            </div>
        `).join('');
    }

    function escapeHtml(str) {
        return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    // --- ATAJOS DE TECLADO ---

    document.addEventListener('keydown', (e) => {
        if (['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;

        switch(e.key.toLowerCase()) {
            case ' ':
                e.preventDefault();
                video.paused ? video.play() : video.pause();
                break;
            case 'i':
                e.preventDefault();
                setStartTimeFromVideo();
                break;
            case 'o':
                e.preventDefault();
                setEndTimeFromVideo();
                break;
            case 'p':
                e.preventDefault();
                togglePlayClip();
                break;
            case 'arrowleft':
                e.preventDefault();
                video.currentTime = Math.max(0, video.currentTime - 0.1);
                break;
            case 'arrowright':
                e.preventDefault();
                video.currentTime = Math.min(video.duration || 0, video.currentTime + 0.1);
                break;
        }
    });

    video.addEventListener('play', () => {
        if (!isPlayingClip) updateStatusBadge(false);
    });
</script>

</body>
</html>
